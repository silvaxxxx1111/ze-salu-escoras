<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zé Salu Escoras e Andaimes</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#f5f7fa;
  text-align:center;
  padding:50px;
}
.card{
  background:white;
  max-width:600px;
  margin:auto;
  padding:30px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}
</style>
</head>
<body>

<div class="card">
  <h1>Zé Salu Escoras e Andaimes</h1>

  <h2>Nova Locação</h2>

  <input id="cliente" placeholder="Nome do cliente">

  <input id="telefone" placeholder="Telefone">

  <input id="escoras" type="number" placeholder="Quantidade de escoras">

  <input id="andaimes" type="number" placeholder="Quantidade de andaimes">

  <textarea id="observacao" placeholder="Observação"></textarea>

  <button onclick="salvarLocacao()">
  Salvar Locação
   
</button>
  <hr>

<h3>Locações Cadastradas</h3>

<div id="listaLocacoes"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
const SUPABASE_URL = "https://kpjtjkzmnqvnefmjpcnq.supabase.co";
const SUPABASE_KEY = "sb_publishable_W1VUYzn8GfWj9TKUEHyyTg_DlEg3evm";

const { createClient } = supabase;
const client = createClient(SUPABASE_URL, SUPABASE_KEY);

async function salvarLocacao() {

  const cliente = document.getElementById("cliente").value;
  const telefone = document.getElementById("telefone").value;
  const escoras = Number(document.getElementById("escoras").value || 0);
  const andaimes = Number(document.getElementById("andaimes").value || 0);
  const observacao = document.getElementById("observacao").value;

  const { error } = await client
    .from("locacoes")
    .insert([
      {
        cliente,
        telefone,
        escoras,
        andaimes,
        observacao
      }
    ]);

  if (error) {
    alert(error.message);
  } else {
    alert("Locação salva com sucesso!");
    carregarLocacoes();
    
  }
}
    async function carregarLocacoes() {

  const { data, error } = await client
    .from("locacoes")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    console.log(error);
    return;
  }

  let html = "";

  data.forEach(locacao => {
    const dataInicio = new Date(locacao.data_inicio);

const dataFinal = locacao.data_fim
  ? new Date(locacao.data_fim)
  : new Date();

const diasLocados = Math.max(
  1,
  Math.ceil((dataFinal - dataInicio) / (1000 * 60 * 60 * 24))
);

const valorDia =
  (locacao.escoras * 1.0) +
  (locacao.andaimes * 5.0);

const valorTotal = valorDia * diasLocados;
   html += `
  <div style="border:1px solid #ccc;padding:10px;margin:10px 0;">
    <strong>${locacao.cliente}</strong><br>
    Telefone: ${locacao.telefone}<br>
    Escoras: ${locacao.escoras}<br>
    Andaimes: ${locacao.andaimes}<br>
    Observação: ${locacao.observacao || ""}<br>
    Data início: ${new Date(locacao.data_inicio).toLocaleDateString('pt-BR')}<br>
Data devolução: ${locacao.data_fim ? new Date(locacao.data_fim).toLocaleDateString('pt-BR') : "-"}<br>
    Status: ${locacao.status || "ativa"}<br><br>
    Dias locados: ${diasLocados}<br>
Valor por dia: R$ ${valorDia.toFixed(2)}<br>
Total acumulado: R$ ${valorTotal.toFixed(2)}<br><br>

    ${locacao.status !== "devolvida" ? `
<button onclick="devolverLocacao(${locacao.id})">
  Devolver
</button>
` : ""}
  </div>
`;
  });

  document.getElementById("listaLocacoes").innerHTML = html;
}
    async function devolverLocacao(id) {

  const { error } = await client
    .from("locacoes")
    .update({
  status: "devolvida",
  data_fim: new Date().toISOString()
})
    .eq("id", id);

  if (error) {
    alert(error.message);
  } else {
    alert("Locação devolvida!");
    carregarLocacoes();
  }
}
    window.onload = carregarLocacoes;
</script>
</body>
</html>
