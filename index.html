<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Zé Salu Escoras e Andaimes</title>
<style>
body{
  font-family: Arial, sans-serif;

  padding:50px;
}
.card{
  background:white;
  max-width:600px;

  padding:30px;

<body>

<div class="card">
  <h1>Zé Salu Escoras e Andaimes</h1>

  <h2>Nova Locação</h2>

  <input id="cliente" placeholder="Nome do cliente">

  <input id="telefone" placeholder="Telefone">

  <input id="escoras" type="number" placeholder="Quantidade de escoras">

  <input id="andaimes" type="number" placeholder="Quantidade de andaimes">

  <textarea id="observacao" placeholder="Observação"></textarea>

  <button onclick="salvarLocacao()">
  Salvar Locação
   
</button>
  <hr>

<h3>Locações Cadastradas</h3>

<div id="listaLocacoes"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
const SUPABASE_URL = "https://kpjtjkzmnqvnefmjpcnq.supabase.co";
const SUPABASE_KEY = "sb_publishable_W1VUYzn8GfWj9TKUEHyyTg_DlEg3evm";

const { createClient } = supabase;
const client = createClient(SUPABASE_URL, SUPABASE_KEY);

async function salvarLocacao() {

  const cliente = document.getElementById("cliente").value;
  const telefone = document.getElementById("telefone").value;
  const escoras = Number(document.getElementById("escoras").value || 0);
  const andaimes = Number(document.getElementById("andaimes").value || 0);
  const observacao = document.getElementById("observacao").value;

  const { error } = await client
    .from("locacoes")
    .insert([
      {
        cliente,
        telefone,
        escoras,
        andaimes,
        observacao
      }
    ]);

  if (error) {
    alert(error.message);
  } else {
    alert("Locação salva com sucesso!");
    carregarLocacoes();
    
  }
}
    window.onload = carregarLocacoes;
</script>
</body>
